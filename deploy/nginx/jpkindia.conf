# Nginx configuration for jpkindia.org (HTTP only; run certbot to enable HTTPS)
server {
  listen 80;
  server_name jpkindia.org www.jpkindia.org;
  # Moved build artifacts to a standard web root owned by www-data
  root /var/www/jpkindia;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Basic security headers (add more after HTTPS enabled)
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;

  access_log /var/log/nginx/jpkindia.access.log;
  error_log  /var/log/nginx/jpkindia.error.log;
}
